{% extends "base.html" %}{% block title %}Activity Report · OJTTrack{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">DAILY OJT LOG</span><h1>{{ 'Edit activity report' if report else 'New activity report' }}</h1><p>Describe the work you completed and what you learned.</p></div><a class="btn btn-secondary" href="{{ url_for('activities.list_activities') }}">← Back to activities</a></div>
<div class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Activity date<input type="date" name="activity_date" required value="{{ report['activity_date'] if report else '' }}"></label><label>Hours spent<input type="number" name="hours_spent" min="0" max="24" step="0.25" required value="{{ report['hours_spent'] if report else '' }}"></label><label class="full-field">Activity title<input name="title" required maxlength="150" value="{{ report['title'] if report else '' }}"></label><label class="full-field">Description of tasks<textarea name="description" required rows="4">{{ report['description'] if report else '' }}</textarea></label><label class="full-field">Skills or knowledge learned<textarea name="skills_learned" rows="3">{{ report['skills_learned'] if report else '' }}</textarea></label><label class="full-field">Challenges encountered<textarea name="challenges" rows="3">{{ report['challenges'] if report else '' }}</textarea></label><div class="full-field form-actions"><button class="btn btn-primary" type="submit">Submit report →</button></div></form></div>{% endblock %}
