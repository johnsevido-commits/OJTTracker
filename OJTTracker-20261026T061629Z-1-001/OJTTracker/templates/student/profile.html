{% extends "base.html" %}{% block title %}My Profile · OJTTrack{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">ACCOUNT INFORMATION</span><h1>My Profile</h1><p>Keep your OJT details up to date.</p></div></div>
<div class="panel form-panel"><div class="profile-identity"><div class="avatar large">{{ current_user_name[:1]|upper }}</div><div><h2>{{ user['full_name'] }}</h2><p>{{ user['email'] }} · {{ user['username'] }}</p></div></div><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Course<input name="course" value="{{ student['course'] if student else 'BSIS' }}"></label><label>Section<input name="section" value="{{ student['section'] if student else '' }}"></label><label class="full-field">OJT company / organization<input name="company_name" value="{{ student['company_name'] if student else '' }}"></label><div class="full-field form-actions"><button class="btn btn-primary">Save profile</button></div></form></div>{% endblock %}
