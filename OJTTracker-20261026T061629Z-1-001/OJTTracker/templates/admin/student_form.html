{% extends "base.html" %}{% block title %}Student account · OJTTrack{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">STUDENT DIRECTORY</span><h1>{{ 'Edit student' if student else 'Add student' }}</h1><p>Student records are used by attendance and report management.</p></div><a class="btn btn-secondary" href="{{ url_for('admin.students') }}">← Back</a></div>
<div class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="full-field">Full name<input name="full_name" required value="{{ student['full_name'] if student else '' }}"></label><label>Username<input name="username" required value="{{ student['username'] if student else '' }}"></label><label>Email<input type="email" name="email" required value="{{ student['email'] if student else '' }}"></label><label>Student number<input name="student_number" value="{{ student['student_number'] if student else '' }}"></label><label>Course<input name="course" value="{{ student['course'] if student else 'BSIS' }}"></label><label>Section<input name="section" value="{{ student['section'] if student else '' }}"></label><label>OJT company<input name="company_name" value="{{ student['company_name'] if student else '' }}"></label><label>Required OJT hours<input type="number" name="required_ojt_hours" min="0" step="1" value="{{ student['required_ojt_hours'] if student else 486 }}"></label>{% if not student %}<label class="full-field">Temporary password (minimum 8 characters)<input type="password" name="password" required minlength="8"></label>{% else %}<label>Account status<select name="account_status"><option value="active" {% if student['account_status']=='active' %}selected{% endif %}>Active</option><option value="inactive" {% if student['account_status']=='inactive' %}selected{% endif %}>Inactive</option></select></label>{% endif %}<div class="full-field form-actions"><button class="btn btn-primary">Save student</button></div></form></div>{% endblock %}
